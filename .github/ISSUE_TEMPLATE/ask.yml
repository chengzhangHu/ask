name: 问知识库
description: 基于公开知识库检索回答（仅公开已发布内容，匿名可问）
title: "[Ask] "
labels: [ask-runtime]
body:
  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 尽量具体，便于检索到最相关文章（≤500 字）
      placeholder: 例如：AI E2E 测试如何做质量门禁？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景（可选）
      description: 补充你想解决的场景或已有尝试
    validations:
      required: false